name: Mirror ISO to Temporary File Host

on:
  workflow_dispatch: # Gives you the manual "Run workflow" trigger button

jobs:
  upload-to-temp-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download ISO from Blocked Server
        run: |
          echo "Bypassing network blocks via GitHub Runner..."
          curl -L -o ubuntu-web-20.04.3-livecd.iso "http://darkpenguin.net"
          echo "Download complete. Checking file size..."
          ls -lh ubuntu-web-20.04.3-livecd.iso

      - name: Upload to Temp.sh Storage
        run: |
          echo "Uploading to temp.sh (Supports up to 4GB files)..."
          echo "------------------------------------------------"
          # This uploads the file and prints the direct unblocked link to your logs
          curl -F "file=@ubuntu-web-20.04.3-livecd.iso" https://temp.sh/upload
          echo ""
          echo "------------------------------------------------"
          echo "Copy the URL printed above to your browser to download the file!"
