name: Mirror ISO via GitHub Artifacts

on:
  workflow_dispatch: # Gives you the manual play button

jobs:
  download-and-store:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download ISO from Archive.org
        run: |
          echo "GitHub runner fetching file from Archive.org servers..."
          curl -L -o ubuntu-web-20.04.1-livecd.iso "https://archive.org"
          echo "Download complete! Displaying file verification info:"
          ls -lh ubuntu-web-20.04.1-livecd.iso

      - name: Upload Intact ISO as Run Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ubuntu-Web-ISO
          path: ubuntu-web-20.04.1-livecd.iso
          retention-days: 7 # Kept for a week to save your repository space
